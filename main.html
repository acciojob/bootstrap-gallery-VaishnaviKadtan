<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cards Gallery</title>

    <!-- Bootstrap CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        .card {
            border-radius: 12px;
            overflow: hidden;
        }

        .card img {
            height: 180px;
            object-fit: cover;
            cursor: pointer;
        }

        .card h6,
        .card p {
            text-align: center;
        }

        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
        }

        .lightbox img {
            max-width: 80%;
            max-height: 80%;
            border-radius: 8px;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container my-4">

    <h2 class="text-center mb-4">Cards Gallery</h2>

    <div class="row g-3">

        <!-- Card 1 -->
        <div class="col-md-4">
            <div class="card">
                <img src="https://picsum.photos/600/400?random=1"
                     onclick="openLightbox(this.src)">
                <div class="card-body">
                    <h6>Mountain</h6>
                    <p>Beautiful mountain view.</p>
                </div>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="col-md-4">
            <div class="card">
                <img src="https://picsum.photos/600/400?random=2"
                     onclick="openLightbox(this.src)">
                <div class="card-body">
                    <h6>Nature</h6>
                    <p>Peaceful natural scenery.</p>
                </div>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="col-md-4">
            <div class="card">
                <img src="https://picsum.photos/600/400?random=3"
                     onclick="openLightbox(this.src)">
                <div class="card-body">
                    <h6>Forest</h6>
                    <p>Green and beautiful forest.</p>
                </div>
            </div>
        </div>

        <!-- Card 4 -->
        <div class="col-md-4">
            <div class="card">
                <img src="https://picsum.photos/600/400?random=4"
                     onclick="openLightbox(this.src)">
                <div class="card-body">
                    <h6>Lake</h6>
                    <p>Calm and beautiful lake.</p>
                </div>
            </div>
        </div>

        <!-- Card 5 -->
        <div class="col-md-4">
            <div class="card">
                <img src="https://picsum.photos/600/400?random=5"
                     onclick="openLightbox(this.src)">
                <div class="card-body">
                    <h6>Landscape</h6>
                    <p>Amazing landscape view.</p>
                </div>
            </div>
        </div>

        <!-- Card 6 -->
        <div class="col-md-4">
            <div class="card">
                <img src="https://picsum.photos/600/400?random=6"
                     onclick="openLightbox(this.src)">
                <div class="card-body">
                    <h6>Scenery</h6>
                    <p>Beautiful scenic view.</p>
                </div>
            </div>
        </div>

    </div>
</div>


<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="close">&times;</span>
    <img id="lightboxImage" src="">
</div>


<script>
function openLightbox(image) {
    document.getElementById("lightbox").style.display = "flex";
    document.getElementById("lightboxImage").src = image;
}

function closeLightbox() {
    document.getElementById("lightbox").style.display = "none";
}
</script>

</body>
</html>
